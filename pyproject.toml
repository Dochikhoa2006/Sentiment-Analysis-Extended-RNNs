[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "app-review-sentiment"
version = "2.0.0"
description = "Reproducible five-class app-review sentiment analysis with FastText and bidirectional RNNs"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "CC-BY-4.0" }
authors = [{ name = "Chi Khoa Do" }]
keywords = [
  "sentiment-analysis",
  "fasttext",
  "bidirectional-gru",
  "bidirectional-lstm",
  "tensorflow",
  "pyspark",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "gensim>=4.3,<5",
  "joblib>=1.3,<2",
  "numpy>=1.26,<3",
]

[project.optional-dependencies]
inference = ["tensorflow>=2.16,<2.22"]
ml = [
  "pandas>=2.2,<3.1",
  "scikit-learn>=1.4,<1.9",
  "scipy>=1.12,<1.18",
  "tensorflow>=2.16,<2.22",
]
data = [
  "datasets>=3,<5",
  "matplotlib>=3.8,<4",
  "pandas>=2.2,<3.1",
  "pyspark>=3.5,<4.2",
  "seaborn>=0.13,<0.14",
  "squarify>=0.4,<0.5",
]
all = [
  "datasets>=3,<5",
  "matplotlib>=3.8,<4",
  "pandas>=2.2,<3.1",
  "pyspark>=3.5,<4.2",
  "scikit-learn>=1.4,<1.9",
  "scipy>=1.12,<1.18",
  "seaborn>=0.13,<0.14",
  "squarify>=0.4,<0.5",
  "tensorflow>=2.16,<2.22",
]
dev = [
  "pytest>=8,<10",
  "pytest-cov>=5,<8",
  "ruff>=0.9,<1",
]

[project.scripts]
sentiment-analyzer = "sentiment_analyzer.cli:main"

[project.urls]
Homepage = "https://github.com/Dochikhoa2006/Sentiment-Analysis-Extended-RNNs"
Repository = "https://github.com/Dochikhoa2006/Sentiment-Analysis-Extended-RNNs"
Issues = "https://github.com/Dochikhoa2006/Sentiment-Analysis-Extended-RNNs/issues"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

